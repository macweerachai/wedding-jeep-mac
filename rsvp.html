<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตอบรับคำเชิญ · Jeep & Mac</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="extras.css">
<style>
textarea{width:100%;min-height:96px;padding:12px 16px;border:1px solid #e6d3d7;border-radius:var(--r-sm);background:var(--blush-2);color:var(--ink);font:inherit;font-size:16px;resize:vertical}
.opt{color:var(--mute);font-weight:400;font-size:13px}
.req{color:var(--rose)}
.thanks{text-align:center;padding:36px 22px}
.thanks h2{margin-bottom:8px}
</style>
</head>
<body>
<main class="site-shell form-page">
<header class="page-heading compact-heading">
<a class="back-link" href="index.html" id="back">← กลับหน้าแรก</a>
<div class="monogram" aria-label="WW"><img src="ww-monogram.png" alt="WW monogram"></div>
<p class="eyebrow" id="eyebrow">ขอเรียนเชิญ</p>
<h1 id="h1">ตอบรับคำเชิญ</h1>
<p class="muted" id="desc">กรอกข้อมูลสั้นๆ เพื่อยืนยันการเข้าร่วมงาน</p>
</header>

<form id="rsvpForm" class="card form-card" novalidate>
<label for="name"><span id="l_name">ชื่อของคุณ</span> <span class="req">*</span></label>
<input id="name" type="text" autocomplete="name" maxlength="100" required>

<label for="attending"><span id="l_att">คุณจะมาร่วมงานไหม</span> <span class="req">*</span></label>
<select id="attending">
<option value="yes" id="o_yes">ไปร่วมงานแน่นอน</option>
<option value="no" id="o_no">ไม่สามารถไปได้</option>
</select>

<div id="guestsWrap">
<label for="guests"><span id="l_guests">คุณจะมากี่คน (รวมตัวคุณเอง)</span> <span class="req">*</span></label>
<select id="guests"></select>
</div>

<label for="side"><span id="l_side">คุณเป็นแขกของฝั่งไหน</span> <span class="req">*</span></label>
<select id="side">
<option value="" id="o_pick">— เลือก —</option>
<option value="bride" id="o_bride">ฝั่งเจ้าสาว (จิ๊บ)</option>
<option value="groom" id="o_groom">ฝั่งเจ้าบ่าว (แม็ค)</option>
</select>

<label for="phone"><span id="l_phone">เบอร์โทร</span> <span class="opt" id="l_opt1">(ไม่บังคับ)</span></label>
<input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" placeholder="08x-xxx-xxxx">

<label for="allergy"><span id="l_allergy">อาหารที่แพ้</span> <span class="opt" id="l_opt2">(ไม่บังคับ)</span></label>
<input id="allergy" type="text" maxlength="200">

<label for="message"><span id="l_msg">ข้อความถึงเจ้าภาพ</span> <span class="opt" id="l_opt3">(ไม่บังคับ)</span></label>
<textarea id="message" maxlength="500"></textarea>

<button id="submitBtn" type="submit">ยืนยันการตอบรับ</button>
<div id="submitMsg" aria-live="polite"></div>
</form>

<section id="thanks" class="card thanks" style="display:none">
<h2 id="t_h">ขอบคุณที่ตอบรับ</h2>
<p class="muted" id="t_p">เราได้รับข้อมูลของคุณแล้ว</p>
</section>

<nav class="nav">
<a href="index.html" id="n_back">← กลับหน้าแรก</a>
<a href="seat.html" id="n_seat">ค้นหาที่นั่ง</a>
</nav>
</main>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="shared.js"></script>
<script>
(function () {
var D = {
th: { back:'← กลับหน้าแรก', eyebrow:'ขอเรียนเชิญ', h1:'ตอบรับคำเชิญ', desc:'กรอกข้อมูลสั้นๆ เพื่อยืนยันการเข้าร่วมงาน',
l_name:'ชื่อของคุณ', l_att:'คุณจะมาร่วมงานไหม', o_yes:'ไปร่วมงานแน่นอน', o_no:'ไม่สามารถไปได้', l_guests:'คุณจะมากี่คน (รวมตัวคุณเอง)',
l_side:'คุณเป็นแขกของฝั่งไหน', o_pick:'— เลือก —', o_bride:'ฝั่งเจ้าสาว (จิ๊บ)', o_groom:'ฝั่งเจ้าบ่าว (แม็ค)',
l_phone:'เบอร์โทร', l_allergy:'อาหารที่แพ้', l_msg:'ข้อความถึงเจ้าภาพ', opt:'(ไม่บังคับ)', submit:'ยืนยันการตอบรับ',
n_back:'← กลับหน้าแรก', n_seat:'ค้นหาที่นั่ง', people:'คน', need:'กรุณากรอกข้อมูลที่มี * ให้ครบ', fail:'ส่งไม่สำเร็จ ลองอีกครั้ง',
t_yes:'ขอบคุณที่ตอบรับ แล้วพบกันวันงานนะ', t_no:'ขอบคุณที่แจ้งให้ทราบ เสียดายที่ไม่ได้เจอกัน', t_p:'เราได้รับข้อมูลของคุณแล้ว' },
en: { back:'← Back', eyebrow:'You are invited', h1:'RSVP', desc:'A few quick details to confirm your attendance',
l_name:'Your name', l_att:'Will you attend?', o_yes:'Yes, I will be there', o_no:'Sorry, I cannot make it', l_guests:'How many guests (including you)?',
l_side:'Which side are you a guest of?', o_pick:'— Select —', o_bride:"Bride's side (Jeep)", o_groom:"Groom's side (Mac)",
l_phone:'Phone', l_allergy:'Food allergies', l_msg:'Message to the hosts', opt:'(optional)', submit:'Confirm RSVP',
n_back:'← Back', n_seat:'Find your seat', people:'', need:'Please fill in all fields marked *', fail:'Could not send. Please try again.',
t_yes:'Thank you! See you at the wedding.', t_no:'Thank you for letting us know. We will miss you.', t_p:'We have received your reply.' },
ja: { back:'← 戻る', eyebrow:'ご招待', h1:'出欠のご返信', desc:'ご出席の確認に簡単な情報をご入力ください',
l_name:'お名前', l_att:'ご出席いただけますか', o_yes:'出席します', o_no:'欠席します', l_guests:'ご出席人数（ご本人を含む）',
l_side:'どちら側のゲストですか', o_pick:'— 選択 —', o_bride:'新婦側（ジップ）', o_groom:'新郎側（マック）',
l_phone:'電話番号', l_allergy:'食物アレルギー', l_msg:'主催者へのメッセージ', opt:'（任意）', submit:'送信する',
n_back:'← 戻る', n_seat:'席を探す', people:'名', need:'* の項目をご入力ください', fail:'送信できませんでした。もう一度お試しください。',
t_yes:'ご返信ありがとうございます。当日お会いしましょう。', t_no:'ご連絡ありがとうございます。', t_p:'ご返信を受け取りました。' }
};
function L() { return D[window.WED_LANG] || D.th; }
var $ = function (id) { return document.getElementById(id); };
function setT(id, key) { var el = $(id); if (el) el.textContent = L()[key]; }

function buildGuests() {
var cur = $('guests').value || '1', sel = $('guests'), u = L().people;
sel.innerHTML = '';
for (var i = 1; i <= 10; i++) { var o = document.createElement('option'); o.value = i; o.textContent = i + (u ? ' ' + u : ''); sel.appendChild(o); }
sel.value = cur;
}
function render() {
[['back','back'],['eyebrow','eyebrow'],['h1','h1'],['desc','desc'],['l_name','l_name'],['l_att','l_att'],['o_yes','o_yes'],['o_no','o_no'],
['l_guests','l_guests'],['l_side','l_side'],['o_pick','o_pick'],['o_bride','o_bride'],['o_groom','o_groom'],['l_phone','l_phone'],
['l_allergy','l_allergy'],['l_msg','l_msg'],['l_opt1','opt'],['l_opt2','opt'],['l_opt3','opt'],['n_back','n_back'],['n_seat','n_seat'],['t_p','t_p']]
.forEach(function (p) { setT(p[0], p[1]); });
$('submitBtn').textContent = L().submit;
buildGuests();
}
render();
document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('.lang-switch')) setTimeout(render, 50); });

$('attending').addEventListener('change', function () { $('guestsWrap').style.display = this.value === 'yes' ? '' : 'none'; });

var key = WED.newKey();
function msg(text, kind) { $('submitMsg').innerHTML = text ? '<div class="msg ' + kind + '"></div>' : ''; if (text) $('submitMsg').firstChild.textContent = text; }

$('rsvpForm').addEventListener('submit', function (ev) {
ev.preventDefault();
var name = $('name').value.trim(), side = $('side').value, att = $('attending').value;
if (!name || !side) { msg(L().need, 'err'); return; }
var btn = $('submitBtn'); btn.disabled = true; msg('', '');
WED.call('POST', 'rsvpOpen', {
idempotency_key: key, name: name, attending: att,
guests: att === 'yes' ? parseInt($('guests').value, 10) : 0, side: side,
phone: $('phone').value.trim(), allergy: $('allergy').value.trim(), message: $('message').value.trim()
}).then(function (r) {
btn.disabled = false;
if (!r || !r.ok) { msg(L().fail, 'err'); return; }
$('rsvpForm').style.display = 'none';
$('t_h').textContent = att === 'yes' ? L().t_yes : L().t_no;
$('thanks').style.display = '';
window.scrollTo({ top: 0, behavior: 'smooth' });
}, function () { btn.disabled = false; msg(L().fail, 'err'); });
});
})();
</script>
<script src="extras.js"></script>
</body>
</html>
